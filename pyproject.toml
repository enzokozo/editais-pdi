[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "editais"
version = "0.1.0"
description = "LLM-based multi-agent pipeline for capturing and screening R&D funding calls from Brazilian agencies. FAPEMIG is the first supported source."
requires-python = ">=3.11,<3.14"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
